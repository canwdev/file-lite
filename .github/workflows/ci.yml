name: CI

# The release workflow only builds on tags and master pushes, so nothing used to
# run the test suites: `bun test` sat red without anyone noticing. This workflow
# is the gate for pull requests and both pushes.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        # eslint plus the style-contract guardrail (scripts/check-styles.mjs).
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun test

name: Release (Go)

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-go-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: master builds derive their notes from the commits
          # since the previous version tag.
          fetch-depth: 0

      - name: Read VERSION from frontend/src/enum/version.ts
        id: appver
        run: |
          V=$(sed -n "s/export const VERSION = '\([^']*\)'.*/\1/p" frontend/src/enum/version.ts)
          if [ -z "$V" ]; then
            echo "Could not parse VERSION from frontend/src/enum/version.ts" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Resolve release target
        id: rel
        run: |
          # A v* tag (pushed, or the ref a manual run points at) is the official
          # release and takes its notes from the CHANGELOG.
          # Any branch build, including master pushes, is a pre-release with one
          # v<version>-pre.<run_number> tag per run and notes from the commits.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=false
          else
            TAG="v${{ steps.appver.outputs.version }}-pre.${{ github.run_number }}"
            PRERELEASE=true
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (prerelease=${PRERELEASE})"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend for Go embed
        working-directory: frontend
        run: |
          bun install
          bun run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod

      - name: Generate icon (rsrc.syso for Windows)
        working-directory: backend-go
        run: |
          bun install
          go install github.com/akavel/rsrc@latest
          bun run icon

      - name: Build Go binaries and pack release assets
        working-directory: backend-go
        # Also fails the release when frontend/src/enum/version.ts and backend-go/config/config.go disagree.
        run: bun run ./scripts/build.ts --all --skip-frontend

      - name: Extract release notes from CHANGELOG
        if: steps.rel.outputs.prerelease == 'false'
        run: bash .github/scripts/changelog-section.sh '${{ steps.appver.outputs.version }}'

      - name: Build pre-release notes from commits
        if: steps.rel.outputs.prerelease == 'true'
        run: bash .github/scripts/commit-notes.sh '${{ steps.rel.outputs.tag_name }}'

      - name: Publish official release
        if: steps.rel.outputs.prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag_name }}
          name: ${{ steps.rel.outputs.tag_name }}
          prerelease: false
          # 正文优先用 CHANGELOG 小节；抠不到才回退到自动生成
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ hashFiles('RELEASE_NOTES.md') == '' }}
          # scripts/build.ts 输出到仓库根目录，文件名固定为 file-lite-<os>_<arch>-v<version>.zip
          files: |
            file-lite-*-v${{ steps.appver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release
        if: steps.rel.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag_name }}
          name: ${{ steps.rel.outputs.tag_name }}
          prerelease: true
          # 预发布 tag 由本次运行创建，指向当前提交
          target_commitish: ${{ github.sha }}
          # 正文来自提交记录；生成失败时回退到自动生成
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ hashFiles('RELEASE_NOTES.md') == '' }}
          files: |
            file-lite-*-v${{ steps.appver.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

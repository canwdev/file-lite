<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>File Lite</title>
{{template "style"}}
</head>
<body>
<div class="win dialog">
<div class="title">File Lite - Sign in</div>
<form method="post" action="/ie/login" accept-charset="UTF-8">
{{if .Error}}<p><b>{{.Error}}</b></p>{{end}}
<input type="hidden" name="next" value="{{.Next}}">
<p>Password: <input type="password" name="password" size="20"></p>
<p><label><input type="checkbox" name="remember" value="1" checked> Remember me</label></p>
<p><input class="btn" type="submit" value="Sign in"></p>
</form>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>File Lite</title>
</head>
<body>
<h1>File Lite</h1>
{{if .Error}}<p><b>{{.Error}}</b></p>{{end}}
<form method="post" action="/ie/login" accept-charset="UTF-8">
{{if .Ticket}}<input type="hidden" name="ticket" value="{{.Ticket}}">{{end}}
<input type="hidden" name="next" value="{{.Next}}">
<p>Password: <input type="password" name="password" size="24"></p>
<p><label><input type="checkbox" name="remember" value="1"> Remember me</label></p>
<p><input type="submit" value="Sign in"></p>
</form>
</body>
</html>

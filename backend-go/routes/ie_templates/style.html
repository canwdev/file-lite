{{define "style"}}
<style>
/* 这套界面是给老浏览器（IE8）看的：没有 vgo-ui 令牌可用，
   所以在这里手写一小份 Win95 风格的复古样式：灰底、双色浮雕、方角。

   只用 IE8 认得的那部分 CSS：
   - 布局靠表格 / 浮动 / 定位，不用 flex、grid，也不用 gap（IE8 都不认识），
     所以间距一律用 margin / padding；
   - 不用 CSS3（圆角、阴影、渐变、transition、box-sizing），选择器只用标签、类、
     后代和 :hover（IE7 起 :hover 对所有元素生效，只有 IE6 才限于 <a>）；
   - 每个页面都带 DOCTYPE，IE8 因此跑在标准模式，盒模型与别的浏览器一致。 */
body{background:#008080;color:#000;margin:8px;font:14px Tahoma,"MS Sans Serif","Microsoft YaHei",SimSun,sans-serif;scrollbar-face-color:#c0c0c0;scrollbar-track-color:#dfdfdf;scrollbar-arrow-color:#000;scrollbar-shadow-color:#808080;scrollbar-highlight-color:#fff;scrollbar-3dlight-color:#dfdfdf;scrollbar-darkshadow-color:#000}
a{color:#000080;text-decoration:none;}
a:hover{text-decoration:underline;}
.win{background:#c0c0c0;border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;padding:2px;max-width: 1200px;margin: 0 auto;}
.title{background:#000080;color:#fff;font-weight:bold;padding:2px 4px;margin-bottom:2px}
.toolbar{border-bottom:1px solid #808080;padding:4px;margin-bottom:4px;overflow:hidden}
.toolbar a{margin-right: 10px;}
.inline{display:inline}
.right{float:right}
.layout{width:100%;border-collapse:collapse}
.side{width:180px;vertical-align:top;padding-right:6px}
.main{vertical-align:top}
.group{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;font-weight:bold;padding:1px 4px}
.panel{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;margin-bottom:6px;overflow:hidden}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{margin:1px 0}
.panel p{margin:2px}
.side-link{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px}
.current{background:#000080;color:#fff}
/* 路径框：输入框占满除 Go 以外的整行。IE8 没有 flexbox，所以靠「容器右侧留一条
   56px 车道 + Go 绝对定位到行尾」实现；输入框用 display:block 去掉行盒的半行距，
   这样它的上边缘就是容器内容区的上边缘，Go 的 top:0 才能和它对齐。
   输入框自带 2px 边框与左右各 2px 内边距，会吃掉车道里的一点点，无伤大雅。 */
.pathrow{position:relative;padding-right:46px;margin-bottom:4px}
.pathinput{display:block;width:100%}
.pathgo{position:absolute;right:0;top:0}
/* 上传与新建文件夹一左一右：右边那组浮动到行尾（空间不够时自动落到下一行并仍然靠右，
   不会把页面撑宽）。一组内部不折行，免得按钮和它的输入框分家。文件框是系统控件，
   比别的控件高，统一按中线对齐才不会把整行拉得参差不齐。 */
.uploadrow{overflow:hidden;margin-bottom:4px}
.uploadrow form{white-space:nowrap;margin-right:12px}
.uploadrow form.right{margin-right:0;margin-left:12px}
.uploadrow input{vertical-align:middle}
/* Fixed layout keeps a long file name from widening the table: with auto layout the
   nowrap name cell stretches the whole table past the panel. Fixed layout takes the
   column widths from the first (header) row, so Size / Modified / Actions need explicit
   widths and the name column takes the rest and clips with an ellipsis. */
.list{table-layout:fixed;width:100%;border-collapse:collapse;background:#fff}
.list th{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;padding:1px 6px;text-align:left}
.list td{border-bottom:1px solid #dfdfdf;padding:1px 6px;white-space:nowrap}
.list .name{overflow:hidden;text-overflow:ellipsis}
.list .size{width:80px}
.list .time{width:150px}
.list .act{width:190px;white-space:nowrap}
/* 行悬停：底色落在单元格上而不是 tr 上——单元格透不出行背景时（老渲染器里常见），
   tr:hover 的高亮就看不见了。 */
.list tr:hover td{background:#dfdfdf}
/* 行内动作（Download / Rename / Delete）之间留出间距：老浏览器没有 gap，
   给每个链接一个右外边距，行尾那一个多出来的 6px 落在单元格里，无伤大雅。 */
.list .act a{margin-right:6px}
.status{border:2px solid;border-color:#fff #808080 #808080 #fff;padding:4px;margin-top:4px}
.status span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:0 6px;margin-right:4px}
.dialog{width:300px;margin:60px auto}
.dialog p{margin:8px}
.fields{margin:8px}
.fields .mode{margin-right:12px}
.fields p{margin:6px 0 0}
</style>
{{end}}

{{define "style"}}
<style>
/* 这套界面是给老浏览器（IE8）看的：没有 vgo-ui 令牌可用，
   所以在这里手写一小份 Win95 风格的复古样式：灰底、双色浮雕、方角。 */
body{background:#008080;color:#000;margin:8px;font:12px Tahoma,"MS Sans Serif","Microsoft YaHei",SimSun,sans-serif;scrollbar-face-color:#c0c0c0;scrollbar-track-color:#dfdfdf;scrollbar-arrow-color:#000;scrollbar-shadow-color:#808080;scrollbar-highlight-color:#fff;scrollbar-3dlight-color:#dfdfdf;scrollbar-darkshadow-color:#000}
a{color:#000080}
.win{background:#c0c0c0;border:2px solid;border-color:#dfdfdf #000 #000 #dfdfdf;padding:2px}
.title{background:#000080;color:#fff;font-weight:bold;padding:2px 4px;margin-bottom:2px}
.toolbar{border-bottom:1px solid #808080;padding:2px 0 4px;overflow:hidden}
.btn{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;color:#000;padding:1px 8px;text-decoration:none;display:inline-block;zoom:1}
.btn:active{border-color:#808080 #fff #fff #808080}
.inline{display:inline}
.right{float:right}
input[type=password],input[type=text]{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:1px 2px;font:12px Tahoma,"MS Sans Serif","Microsoft YaHei",SimSun,sans-serif}
.layout{width:100%;border-collapse:collapse}
.side{width:180px;vertical-align:top;padding-right:6px}
.main{vertical-align:top}
.group{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;font-weight:bold;padding:1px 4px}
.panel{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px;margin-bottom:6px;overflow:hidden}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{margin:1px 0}
.panel p{margin:2px}
.side-link{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-decoration:none;padding:0 2px}
.current{background:#000080;color:#fff}
.pathrow{margin-bottom:4px}
.pathinput{width:75%}
.list{width:100%;border-collapse:collapse;background:#fff}
.list th{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;padding:1px 6px;text-align:left}
.list td{border-bottom:1px solid #dfdfdf;padding:1px 6px;white-space:nowrap}
.list .name{width:100%}
.status{border:2px solid;border-color:#fff #808080 #808080 #fff;padding:2px 4px;margin-top:4px}
.status span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:0 6px;margin-right:4px}
.dialog{width:300px;margin:60px auto}
.dialog p{margin:8px}
.fields{margin:8px}
.fields .mode{margin-right:12px}
.fields p{margin:6px 0 0}
</style>
{{end}}
